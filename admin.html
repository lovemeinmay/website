<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>RAIN License - Admin</title>
	<link rel="stylesheet" href="/assets/admin.css" />
</head>
<body>
	<div class="page">
		<header class="topbar">
			<h1>RAIN License</h1>
			<div class="topbar-right">
				<span id="whoami" class="muted"></span>
				<form action="/logout" method="post">
					<button class="btn btn-ghost" type="submit">Log out</button>
				</form>
			</div>
		</header>

		<section class="card">
			<h2>Public API</h2>
			<p class="muted">
				Put this URL in the script's <code>LICENSE_URL</code> constant. It only ever returns Roblox IDs,
				never Discord info.
			</p>
			<div class="copy-row">
				<code id="apiUrl">(loading...)</code>
				<button class="btn btn-ghost" id="copyApiUrl">Copy</button>
			</div>
		</section>

		<section class="card">
			<h2>Add a license</h2>
			<form id="addForm" class="add-form">
				<div class="field">
					<label for="robloxUsername">Roblox username</label>
					<div class="copy-row">
						<input id="robloxUsername" name="robloxUsername" placeholder="e.g. lovedmeinmay" autocomplete="off" />
						<button class="btn btn-ghost" type="button" id="resolveBtn">Look up</button>
					</div>
				</div>
				<div class="field">
					<label for="robloxUserId">Roblox user id</label>
					<input id="robloxUserId" name="robloxUserId" placeholder="filled in by Look up, or type it yourself" required />
				</div>
				<div class="field">
					<label for="discordUsername">Discord username (optional, for your reference)</label>
					<input id="discordUsername" name="discordUsername" placeholder="e.g. someone" autocomplete="off" />
				</div>
				<div class="field">
					<label for="discordId">Discord id (optional, for your reference)</label>
					<input id="discordId" name="discordId" placeholder="e.g. 112233445566778899" autocomplete="off" />
				</div>
				<div class="field">
					<label for="note">Note (optional)</label>
					<input id="note" name="note" placeholder="anything you want to remember" autocomplete="off" />
				</div>
				<button class="btn btn-accent" type="submit">Add license</button>
				<span id="addError" class="error"></span>
			</form>
		</section>

		<section class="card">
			<h2>Licenses</h2>
			<table class="license-table">
				<thead>
					<tr>
						<th>Roblox</th>
						<th>Discord</th>
						<th>Note</th>
						<th>Added</th>
						<th>Status</th>
						<th></th>
					</tr>
				</thead>
				<tbody id="licenseRows">
					<tr><td colspan="6" class="muted">Loading...</td></tr>
				</tbody>
			</table>
		</section>
	</div>

	<script src="/assets/admin.js"></script>
</body>
</html>
